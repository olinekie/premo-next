backend:
  name: git-gateway
  branch: main

publish_mode: editorial_workflow

media_folder: "public/machines"
public_folder: "/machines"

collections:
  - name: "machines"
    label: "Maszyny"
    label_singular: "Maszyna"
    folder: "content/machines"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    identifier_field: "name"

    fields:
      - label: "Nazwa"
        name: "name"
        widget: "string"

      - label: "Cena"
        name: "price"
        widget: "number"
        value_type: "int"

      - label: "Lokalizacja"
        name: "location"
        widget: "string"

      - label: "Zdjęcie główne"
        name: "image"
        widget: "image"

      - label: "Opis"
        name: "description"
        widget: "text"

      # =========================
      # PARAMETRY TECHNICZNE
      # =========================

      - label: "Parametry techniczne"
        name: "parameters"
        widget: "object"

        fields:

          - label: "Maksymalna długość toczenia w kłach"
            name: "turning_length"
            widget: "string"
            required: false

          - label: "Maksymalna średnica toczenia nad łożem"
            name: "turning_diameter_bed"
            widget: "string"
            required: false

          - label: "Maksymalna średnica toczenia nad suportem"
            name: "turning_diameter_support"
            widget: "string"
            required: false

          - label: "Przelot wrzeciona"
            name: "spindle_bore"
            widget: "string"
            required: false

          - label: "Moc silnika głównego"
            name: "main_motor_power"
            widget: "string"
            required: false

          - label: "Ciężar maszyny"
            name: "weight"
            widget: "string"
            required: false

      # =========================
      # DODATKOWE PARAMETRY
      # =========================

      - label: "Dodatkowe parametry"
        name: "additional_parameters"
        widget: "list"
        required: false

        fields:

          - label: "Nazwa parametru"
            name: "name"
            widget: "string"

          - label: "Wartość"
            name: "value"
            widget: "string"

      # =========================
      # DODATKOWE ZALETY
      # =========================

      - label: "Dodatkowe zalety"
        name: "advantages"
        widget: "list"
        required: false

        field:
          label: "Zaleta"
          name: "advantage"
          widget: "string"

      # =========================
      # GALERIA
      # =========================

      - label: "Galeria"
        name: "images"
        widget: "list"

        field:
          label: "Zdjęcie"
          name: "image"
          widget: "image"